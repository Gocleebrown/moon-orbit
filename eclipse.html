<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipses: shadow cone demo</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
#app{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;padding:12px}
#side{width:210px;display:flex;flex-direction:column;gap:8px}
#side h2{font-size:16px;margin:0 0 4px;color:#ffd84a}
.lv{background:#2b2b2b;color:#fff;border:2px solid #444;border-radius:8px;padding:10px 12px;text-align:left;font-weight:bold;font-size:15px;cursor:pointer}
.lv small{display:block;font-weight:normal;color:#bbb;font-size:12px;margin-top:2px}
.lv.on{background:#f28c1a;border-color:#ffd84a}
.lv.on small{color:#fff}
#main{display:flex;flex-direction:column;align-items:center}
canvas{background:#000;border-radius:8px;max-width:96vw;height:auto}
.ctl{width:min(92vw,640px);display:flex;align-items:center;gap:10px;margin:5px 0;flex-wrap:wrap}
.ctl span{font-size:14px;min-width:90px}
input[type=range]{flex:1;min-width:160px;height:26px}
button.p{background:#f28c1a;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:bold;font-size:15px;cursor:pointer}
label{font-size:15px}
#mode3 .lv{padding:7px 10px;font-size:14px}
#msg{font-size:15px;color:#ddd;width:min(92vw,640px);margin:4px 0;min-height:40px}
#stat{font-size:20px;font-weight:bold;color:#ffd84a;height:26px}
</style></head><body>
<div id="app">
<div id="side"><h2>Eclipses</h2>
<button class="lv" data-l="1">Level 1<small>Earth's shadow cone</small></button>
<button class="lv" data-l="2">Level 2<small>Add the Moon</small></button>
<button class="lv" data-l="3">Level 3<small>Side view: why not every month?</small></button>
</div>
<div id="main">
<canvas id="c" width="640" height="560"></canvas>
<div id="stat"></div>
<div class="ctl"><button class="p" id="play">Play</button><button class="p" id="spd" style="background:#3a7bd5">Speed: Normal</button>
<span id="elab">Earth's orbit</span><input id="se" type="range" min="0" max="360" step="0.5" value="200"></div>
<div class="ctl" id="mrow"><span>Moon's orbit</span><input id="sm" type="range" min="0" max="360" step="0.5" value="150"></div>
<div class="ctl"><label><input type="checkbox" id="cone" checked> Show shadow cone</label></div>
<div class="ctl" id="mode3"><span style="min-width:0">Side view:</span><button class="lv" data-m="0">The Moon's orbit seems to change</button><button class="lv" data-m="1">Earth's orbit seems to tilt</button></div>
<div id="msg"></div>
</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const se=document.getElementById('se'),sm=document.getElementById('sm'),pb=document.getElementById('play'),cb=document.getElementById('cone');
const CX=320,CY=280,R=135,ER=24,L=105,MR=7,MO=64;
let side3=0,spdI=0;const SPD=[['Normal',1],['Slow',.35],['Very slow',.12]];let level=1,ang=+se.value,mang=+sm.value,playing=false;
const TXT3=["Left: the view from above. Right: the same thing from the side, looking at Earth's orbit edge-on (the flat dashed line). The Moon's orbit is tilted (tilt exaggerated here), so at Full Moon it is usually above or below the shadow cone, even when from above it looks lined up. Full Moons happen every month at any time of year. Only when the tilt lines up with the Sun (twice a year, as Earth moves round) does the Full Moon go into the cone.","Same thing, but now the Moon's orbit level never changes (yellow, fixed). As Earth moves round the Sun, Earth's own orbit level (blue line) and its shadow cone appear to tilt up and down against it. Only when they line up, twice a year, does the Full Moon go into the cone."];
const TXT={1:"Drag the slider, or press Play, to move Earth around the Sun. The Sun lights one half of Earth. The shadow cone is the dark space behind Earth, always pointing away from the Sun. (Sizes and distances are not to scale.)",
3:"x",
2:"Now the Moon orbits Earth. Move the Moon with its slider (or press Play) and watch what happens when it goes into the shadow cone. The Moon does not make its own light, so with no sunlight reaching it, it goes dark."};
function inCone(ex,ey,dx,dy,mx,my){
 const rx=mx-ex,ry=my-ey,along=rx*dx+ry*dy,perp=Math.abs(rx*(-dy)+ry*dx);
 if(along<=0||along>ER+L)return 0;
 const hw=ER*(1-along/(ER+L));
 return perp+MR*0.0<hw-MR?1:(perp<hw+MR?0.5:0);   // 1 = fully inside, .5 = partly
}
function drawTop(){
 x.fillStyle='#000';x.fillRect(0,0,640,560);
 const g=x.createRadialGradient(CX,CY,10,CX,CY,70);g.addColorStop(0,'#fff6a0');g.addColorStop(.5,'#ffc83a');g.addColorStop(1,'rgba(255,160,0,0)');
 x.fillStyle=g;x.beginPath();x.arc(CX,CY,70,0,7);x.fill();
 x.fillStyle='#ffd84a';x.beginPath();x.arc(CX,CY,38,0,7);x.fill();
 x.fillStyle='#fff';x.font='bold 16px Arial';x.textAlign='center';x.fillText('Sun',CX,CY+62);
 x.strokeStyle='#888';x.lineWidth=1.5;x.setLineDash([6,6]);x.beginPath();x.arc(CX,CY,R,0,7);x.stroke();x.setLineDash([]);
 const a=ang*Math.PI/180,ex=CX+R*Math.cos(a),ey=CY-R*Math.sin(a);
 const dx=(ex-CX)/R,dy=(ey-CY)/R,px=-dy,py=dx;
 if(cb.checked){
  const tx=ex+dx*(ER+L),ty=ey+dy*(ER+L);
  const gr=x.createLinearGradient(ex,ey,tx,ty);gr.addColorStop(0,'rgba(120,120,140,.75)');gr.addColorStop(1,'rgba(120,120,140,.18)');
  x.fillStyle=gr;x.beginPath();x.moveTo(ex+px*ER,ey+py*ER);x.lineTo(tx,ty);x.lineTo(ex-px*ER,ey-py*ER);x.closePath();x.fill();
  x.strokeStyle='#cfd2e6';x.lineWidth=1.5;x.setLineDash([5,4]);x.stroke();x.setLineDash([]);
  if(level==1){const lx=ex+dx*(ER+L*.5),ly=ey+dy*(ER+L*.5);
   x.save();x.translate(lx,ly);let r=Math.atan2(dy,dx);if(Math.cos(r)<0)r+=Math.PI;x.rotate(r);
   x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Shadow cone',0,5);x.restore();}
 }
 // Earth
 x.fillStyle='#2a6fd6';x.beginPath();x.arc(ex,ey,ER,0,7);x.fill();
 x.fillStyle='#4aa84a';x.beginPath();x.arc(ex-6,ey-5,10,0,7);x.fill();x.beginPath();x.arc(ex+9,ey+8,7,0,7);x.fill();
 x.fillStyle='rgba(0,0,20,.65)';x.beginPath();x.arc(ex,ey,ER,Math.atan2(dy,dx)-Math.PI/2,Math.atan2(dy,dx)+Math.PI/2);x.fill();
 x.strokeStyle='#9bd';x.lineWidth=1;x.beginPath();x.arc(ex,ey,ER,0,7);x.stroke();
 let st='';
 if(level>=2){
  x.strokeStyle='#777';x.lineWidth=1;x.setLineDash([3,4]);x.beginPath();x.arc(ex,ey,MO,0,7);x.stroke();x.setLineDash([]);
  // Moon angle 0 = on the Sun side of Earth; increases counter-clockwise like Earth
  const sunA=Math.atan2(-(CY-ey),CX-ex); // direction Earth->Sun in canvas coords
  const m=mang*Math.PI/180,sa=Math.atan2(CY-ey,CX-ex);
  let mx=ex+MO*Math.cos(sa-m),my=ey+MO*Math.sin(sa-m),ic;
  if(level==3){const q=moonSide(m,a),k=MO/MO3;mx=ex+k*(q.xs*Math.cos(sa)+q.zs*Math.sin(sa));my=ey+k*(q.xs*Math.sin(sa)-q.zs*Math.cos(sa));ic=moonIC(q);}
  else ic=inCone(ex,ey,dx,dy,mx,my);
  // sun-facing half lit
  const toSun=Math.atan2(CY-my,CX-mx);
  if(ic>=1){x.fillStyle='#5a1f12';x.beginPath();x.arc(mx,my,MR,0,7);x.fill();}
  else{x.fillStyle='#ddd';x.beginPath();x.arc(mx,my,MR,toSun-Math.PI/2,toSun+Math.PI/2);x.fill();
   x.fillStyle=ic>0?'#5a1f12':'#333';x.beginPath();x.arc(mx,my,MR,toSun+Math.PI/2,toSun+Math.PI*1.5);x.fill();
   if(ic>0){x.fillStyle='rgba(90,31,18,.6)';x.beginPath();x.arc(mx,my,MR,toSun-Math.PI/2,toSun+Math.PI/2);x.fill();}}
  x.strokeStyle='#999';x.lineWidth=1;x.beginPath();x.arc(mx,my,MR,0,7);x.stroke();
  x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Moon',mx,my+(Math.sin(sa-m)<0?-MR-6:MR+16));
  st=ic>=1?'The Moon is in the shadow cone: no sunlight reaches it!':(ic>0?'The Moon is entering the shadow cone…':'');
 }
 x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText('Earth',ex,ey+(dy<0?ER+(level>1?MO-ER:0)+18:-ER-(level>1?MO-ER:0)-10));
 if(level!=3)document.getElementById('stat').textContent=st;
}

const TILT=25*Math.PI/180;
function moonSide(th,b){ // th = Moon angle from Sun direction, b = angle between node line and Sun direction
 const psi=th+b,u=MO3*Math.cos(psi),w=MO3*Math.sin(psi)*Math.cos(TILT),h=MO3*Math.sin(psi)*Math.sin(TILT);
 return {xs:u*Math.cos(b)+w*Math.sin(b),zs:-u*Math.sin(b)+w*Math.cos(b),h:h};}
const MO3=100,L3=300,EX=235,EY=290;
function moonIC(m){const along=-m.xs,perp=Math.hypot(m.h,m.zs);let ic=0;
 if(along>0&&along<ER+L3){const hw=ER*(1-along/(ER+L3));ic=perp<hw-MR?1:(perp<hw+MR?.5:0)}return ic}
function draw(){
 if(level!=3){drawTop();return}
 x.setTransform(1,0,0,1,0,0);drawTop();
 x.save();x.translate(640,0);x.beginPath();x.rect(0,0,640,560);x.clip();(side3?drawSideB:drawSide)();x.restore();
 x.strokeStyle='#555';x.lineWidth=2;x.beginPath();x.moveTo(640,0);x.lineTo(640,560);x.stroke();
 x.fillStyle='#ffd84a';x.font='bold 15px Arial';x.textAlign='left';x.fillText('TOP VIEW',12,24);x.fillText('SIDE VIEW',652,24);}
function drawSide(){
 x.fillStyle='#000';x.fillRect(0,0,640,560);
 const g=x.createRadialGradient(50,EY,8,50,EY,80);g.addColorStop(0,'#fff6a0');g.addColorStop(.5,'#ffc83a');g.addColorStop(1,'rgba(255,160,0,0)');
 x.fillStyle=g;x.beginPath();x.arc(50,EY,80,0,7);x.fill();x.fillStyle='#ffd84a';x.beginPath();x.arc(50,EY,38,0,7);x.fill();
 x.fillStyle='#fff';x.font='bold 16px Arial';x.textAlign='center';x.fillText('Sun',50,EY+62);
 // flat plane of Earth's orbit, edge-on
 x.strokeStyle='#4a6a8a';x.lineWidth=1.5;x.setLineDash([8,6]);x.beginPath();x.moveTo(100,EY);x.lineTo(636,EY);x.stroke();x.setLineDash([]);
 x.fillStyle='#7fa6cc';x.font='13px Arial';x.textAlign='right';x.fillText("Flat level of Earth's orbit (edge-on)",632,EY+18);
 // 3D shadow cone, side silhouette
 if(cb.checked){const tx=EX+ER+L3;
  const gr=x.createLinearGradient(EX,0,tx,0);gr.addColorStop(0,'rgba(120,120,140,.75)');gr.addColorStop(1,'rgba(120,120,140,.15)');
  x.fillStyle=gr;x.beginPath();x.moveTo(EX,EY-ER);x.lineTo(tx,EY);x.lineTo(EX,EY+ER);x.closePath();x.fill();
  x.strokeStyle='#cfd2e6';x.lineWidth=1.5;x.setLineDash([5,4]);x.stroke();x.setLineDash([]);
  x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Shadow cone (3D)',EX+ER+L3*.72,EY-14);}
 // Earth
 x.fillStyle='#2a6fd6';x.beginPath();x.arc(EX,EY,ER,0,7);x.fill();x.fillStyle='#4aa84a';x.beginPath();x.arc(EX-6,EY-5,10,0,7);x.fill();
 x.fillStyle='rgba(0,0,20,.65)';x.beginPath();x.arc(EX,EY,ER,-Math.PI/2,Math.PI/2);x.fill();
 x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText('Earth',EX,EY+ER+18);
 const b=ang*Math.PI/180;
 // Moon's tilted orbit path
 x.strokeStyle='#888';x.lineWidth=1.2;x.setLineDash([3,4]);x.beginPath();
 for(let k=0;k<=72;k++){const m=moonSide(k*Math.PI/36,b);const sx=EX-m.xs,sy=EY-m.h;k?x.lineTo(sx,sy):x.moveTo(sx,sy)}x.stroke();x.setLineDash([]);
 const th=mang*Math.PI/180,m=moonSide(th,b),mx=EX-m.xs,my=EY-m.h;
 const ic=moonIC(m);
 if(ic>=1){x.fillStyle='#5a1f12';x.beginPath();x.arc(mx,my,MR,0,7);x.fill()}
 else{x.fillStyle='#ddd';x.beginPath();x.arc(mx,my,MR,Math.PI/2,-Math.PI/2);x.fill();x.fillStyle=ic>0?'#5a1f12':'#333';x.beginPath();x.arc(mx,my,MR,-Math.PI/2,Math.PI/2);x.fill()}
 x.strokeStyle='#999';x.beginPath();x.arc(mx,my,MR,0,7);x.stroke();
 x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Moon',mx,my+MR+16);
 let st='';const dFull=Math.abs(((mang-180+540)%360)-180);
 if(ic>=1)st='Lunar eclipse! The Moon is inside the shadow cone.';
 else if(dFull<8)st='Full Moon: from above it looks lined up, but from the side the Moon misses the cone. No eclipse!';
 document.getElementById('stat').textContent=st;}

function drawSideB(){
 const I=TILT,b=ang*Math.PI/180,sd=Math.sin(b)*Math.sin(I),d=Math.asin(sd),cd=Math.cos(d),gam=Math.atan2(Math.sin(b)*Math.cos(I),Math.cos(b));
 x.fillStyle='#000';x.fillRect(0,0,640,560);
 const SX=EX-185*cd,SY=EY-185*sd;
 const g=x.createRadialGradient(SX,SY,8,SX,SY,80);g.addColorStop(0,'#fff6a0');g.addColorStop(.5,'#ffc83a');g.addColorStop(1,'rgba(255,160,0,0)');
 x.fillStyle=g;x.beginPath();x.arc(SX,SY,80,0,7);x.fill();x.fillStyle='#ffd84a';x.beginPath();x.arc(SX,SY,38,0,7);x.fill();
 x.fillStyle='#fff';x.font='bold 16px Arial';x.textAlign='center';x.fillText('Sun',SX,SY+62);
 // Earth's orbit level (flat plane through Sun and Earth) - this is what tilts
 x.strokeStyle='#4a6a8a';x.lineWidth=1.5;x.setLineDash([8,6]);x.beginPath();x.moveTo(SX,SY);x.lineTo(EX+420*cd,EY+420*sd);x.stroke();x.setLineDash([]);
 x.save();x.translate(EX+250*cd,EY+250*sd+(sd>=0?20:-14));x.rotate(d);x.fillStyle='#7fa6cc';x.font='13px Arial';x.textAlign='center';x.fillText("Earth's orbit level (edge-on)",0,0);x.restore();
 // Moon's orbit level: fixed, never changes
 x.strokeStyle='#d0b050';x.lineWidth=1.4;x.setLineDash([3,4]);x.beginPath();x.ellipse(EX,EY,MO3,MO3*0.18,0,0,7);x.stroke();x.setLineDash([]);
 x.fillStyle='#d0b050';x.font='13px Arial';x.textAlign='center';x.fillText("Moon's orbit level (fixed)",EX,EY+MO3*0.18+50);
 // cone, tilted with Earth's orbit level
 if(cb.checked){const ux=cd,uy=sd,nx=-sd,ny=cd,tx=EX+(ER+L3)*ux,ty=EY+(ER+L3)*uy;
  const gr=x.createLinearGradient(EX,EY,tx,ty);gr.addColorStop(0,'rgba(120,120,140,.75)');gr.addColorStop(1,'rgba(120,120,140,.15)');
  x.fillStyle=gr;x.beginPath();x.moveTo(EX+nx*ER,EY+ny*ER);x.lineTo(tx,ty);x.lineTo(EX-nx*ER,EY-ny*ER);x.closePath();x.fill();
  x.strokeStyle='#cfd2e6';x.lineWidth=1.5;x.setLineDash([5,4]);x.stroke();x.setLineDash([]);
  x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Shadow cone (3D)',EX+(ER+L3*.72)*ux,EY+(ER+L3*.72)*uy-18);}
 // Earth, dark side faces away from Sun
 x.fillStyle='#2a6fd6';x.beginPath();x.arc(EX,EY,ER,0,7);x.fill();x.fillStyle='#4aa84a';x.beginPath();x.arc(EX-6,EY-5,10,0,7);x.fill();
 x.fillStyle='rgba(0,0,20,.65)';x.beginPath();x.arc(EX,EY,ER,d-Math.PI/2,d+Math.PI/2);x.fill();
 x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText('Earth',EX,EY+ER+18);
 // Moon on its fixed orbit
 const th=mang*Math.PI/180,tp=th+b-gam,mx=EX-MO3*Math.cos(tp),my=EY+MO3*0.18*Math.sin(tp);
 const ic=moonIC(moonSide(th,b));
 if(ic>=1){x.fillStyle='#5a1f12';x.beginPath();x.arc(mx,my,MR,0,7);x.fill()}
 else{x.fillStyle='#ddd';x.beginPath();x.arc(mx,my,MR,Math.PI/2+d,-Math.PI/2+d);x.fill();x.fillStyle=ic>0?'#5a1f12':'#333';x.beginPath();x.arc(mx,my,MR,-Math.PI/2+d,Math.PI/2+d);x.fill()}
 x.strokeStyle='#999';x.beginPath();x.arc(mx,my,MR,0,7);x.stroke();
 x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Moon',mx,my+MR+16);
 let st='';const dFull=Math.abs(((mang-180+540)%360)-180);
 if(ic>=1)st='Lunar eclipse! The Moon is inside the shadow cone.';
 else if(dFull<8)st='Full Moon, but the cone passes above or below the Moon. No eclipse!';
 document.getElementById('stat').textContent=st;}
function setLevel(l){level=l;c.width=l==3?1280:640;c.style.width=l==3?'min(96vw,1280px)':'';document.querySelectorAll('.lv[data-l]').forEach(b=>b.classList.toggle('on',+b.dataset.l==l));
 document.getElementById('mrow').style.display=l>=2?'flex':'none';document.getElementById('mode3').style.display=l==3?'flex':'none';document.getElementById('elab').textContent=l==3?"Time of year (Earth's place in its orbit)":"Earth's orbit";document.getElementById('msg').textContent=l==3?TXT3[side3]:TXT[l];location.hash=l;draw()}
document.querySelectorAll('.lv[data-l]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.l));
function setMode(m){side3=m;document.querySelectorAll('#mode3 .lv').forEach(b=>b.classList.toggle('on',+b.dataset.m==m));if(level==3)document.getElementById('msg').textContent=TXT3[m];draw()}
document.querySelectorAll('#mode3 .lv').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
se.oninput=()=>{ang=+se.value;draw()};sm.oninput=()=>{mang=+sm.value;draw()};cb.onchange=draw;const sb=document.getElementById('spd');sb.onclick=()=>{spdI=(spdI+1)%3;sb.textContent='Speed: '+SPD[spdI][0]};
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play'};
let last=0;function tick(t){if(playing){const d=(t-last)*SPD[spdI][1];ang=(ang+d*(level>=2?0.006:0.02))%360;se.value=ang;
 if(level>=2){mang=(mang+d*0.08)%360;sm.value=mang}draw()}last=t;requestAnimationFrame(tick)}
setMode(0);setLevel(['#2','#3'].includes(location.hash)?+location.hash[1]:1);requestAnimationFrame(tick);
</script></body></html>
