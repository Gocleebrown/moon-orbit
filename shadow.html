<!-- v5: lunar level removed, solar eclipse is Level 2. v4: Level 1 umbra/penumbra labels + Level 2 Sun, Earth and Moon -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadows: umbra and penumbra</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
#app{display:flex;flex-wrap:nowrap;gap:16px;align-items:flex-start;padding:12px}
#side{width:210px;flex:none;display:flex;flex-direction:column;gap:8px}
#side h2{font-size:16px;margin:0 0 4px;color:#ffd84a}
.lv{background:#2b2b2b;color:#fff;border:2px solid #444;border-radius:8px;padding:10px 12px;text-align:left;font-weight:bold;font-size:15px;cursor:pointer}
.lv small{display:block;font-weight:normal;color:#bbb;font-size:12px;margin-top:2px}
.lv.on{background:#f28c1a;border-color:#ffd84a}.lv.on small{color:#fff}
@media(max-width:760px){#app{flex-wrap:wrap}#side{width:100%}}
#main{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
canvas{background:#000;border-radius:8px;width:100%;height:auto}
.ctl{width:100%;display:flex;align-items:center;gap:12px;margin:5px 0;flex-wrap:wrap}
.ctl span{font-size:15px;min-width:210px}
input[type=range]{flex:1;min-width:200px;height:26px}
label{font-size:15px}
button.b{font-size:15px;padding:8px 14px;border-radius:8px;border:0;background:#ffd84a;font-weight:bold;cursor:pointer}
button.p{background:#f28c1a;color:#fff}button.s{background:#3a7bd5;color:#fff}
#stat{width:100%;font-size:18px;color:#ffd84a;font-weight:bold;min-height:44px;margin:6px 0}
#msg{width:100%;font-size:15px;color:#ddd;margin:4px 0}
</style></head><body>
<div id="app">
<div id="side"><h2>Shadows</h2>
<button class="lv" data-l="1">Level 1<small>Light, object and wall</small></button>
<button class="lv" data-l="2">Level 2<small>Solar eclipse: the Moon's shadow</small></button>
</div>
<div id="main" style="max-width:940px">
<canvas id="c" width="940" height="520"></canvas>
<div id="stat"></div>
<div class="ctl l1"><button class="b" id="clr">Clear beams</button><button class="b" id="all">All dots</button><label><input type="checkbox" id="fill"> Show shadow regions</label></div>
<div class="ctl l1"><span>Size of the light source</span><input id="rl" type="range" min="4" max="80" step="1" value="30"></div>
<div class="ctl l1"><span>Size of the object</span><input id="ro" type="range" min="6" max="80" step="1" value="40"></div>
<div class="ctl l1"><span>Position of the object</span><input id="xo" type="range" min="140" max="520" step="1" value="300"></div>
<div class="ctl l2"><button class="b p" id="play">Play</button><button class="b s" id="spd">Speed: Normal</button><span style="min-width:0">Time of year (Earth's place in its orbit)</span><input id="se" type="range" min="0" max="360" step="0.5" value="40"></div>
<div id="msg"></div>
</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const $=id=>document.getElementById(id);
let level=1;
const TXT={1:"Click the coloured dots on the light source to send beams from that point. Tick 'Show shadow regions' to see the names: the umbra is where the light is completely blocked, and the penumbra is where only some of the light is blocked.",
2:"Now the Moon makes the shadow. Left: the view from above. Sunlight is blocked by the Moon, so the Moon has an umbra (dark inner part) and a penumbra (grey outer part). Right: the view from the Sun. When the Moon is between the Sun and Earth (a New Moon) its shadow lands on Earth as a spot: the penumbra is the big grey spot and the umbra is the tiny dark dot. People inside the penumbra see a partial solar eclipse, and people inside the umbra see a total solar eclipse. The Moon's orbit is tilted, so most months its shadow misses Earth. (Sizes are not to scale.)"};
/* ================= LEVEL 1 ================= */
const XL=70,XW=600,CY=260,WALLH=240;
const K=[-1,-2/3,-1/3,0,1/3,2/3,1];
const COL=['#ff5a5a','#ff9a3c','#ffe14a','#6be26b','#4ad8e8','#6a8cff','#c46bff'];
let sel=new Set([0]);
function pts(Rl){return K.map(k=>({x:XL,y:CY-k*Rl*0.92}))}
function hit(px,py,ty,XO,Ro){
 const dx=XW-px,dy=ty-py,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
 const fx=px-XO,fy=py-CY,b=fx*ux+fy*uy,cc=fx*fx+fy*fy-Ro*Ro,disc=b*b-cc;
 if(disc<0)return null;const t=-b-Math.sqrt(disc);if(t<0)return null;
 return{x:px+ux*t,y:py+uy*t};
}
function draw1(){
 const Rl=+$('rl').value,Ro=+$('ro').value,XO=+$('xo').value,d1=XO-XL,d2=XW-XO;
 const Rp=Ro+(Ro+Rl)*d2/d1, Ru=Ro-(Rl-Ro)*d2/d1;
 const Y=v=>CY-v;
 x.fillStyle='#000';x.fillRect(0,0,940,520);
 x.save();x.beginPath();x.rect(0,0,660,520);x.clip();
 const lab=(t,px,py)=>{x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText(t,px,py)};
 if($('fill').checked){
  x.fillStyle='rgba(150,150,170,.35)';x.beginPath();x.moveTo(XO,Y(Ro));x.lineTo(XW,Y(Rp));x.lineTo(XW,Y(-Rp));x.lineTo(XO,Y(-Ro));x.closePath();x.fill();
  let dt=0;
  if(Ru>=0){x.fillStyle='rgba(20,20,30,.95)';x.beginPath();x.moveTo(XO,Y(Ro));x.lineTo(XW,Y(Ru));x.lineTo(XW,Y(-Ru));x.lineTo(XO,Y(-Ro));x.closePath();x.fill();}
  else{dt=Ro*d1/(Rl-Ro);x.fillStyle='rgba(20,20,30,.95)';x.beginPath();x.moveTo(XO,Y(Ro));x.lineTo(XO+dt,Y(0));x.lineTo(XO,Y(-Ro));x.closePath();x.fill();
   x.fillStyle='rgba(110,110,130,.45)';x.beginPath();x.moveTo(XO+dt,Y(0));x.lineTo(XW,Y(-Ru));x.lineTo(XW,Y(Ru));x.closePath();x.fill();}
  // names
  const t=.72,hp=Ro+(Rp-Ro)*t,hu=Ro+(Ru-Ro)*t;
  if(Ru>=0){
   lab('Penumbra',XO+t*d2,hp-hu>=20?Y((hp+hu)/2)+4:Y(hp)-6);
   if(Ro+(Ru-Ro)*.35>=8)lab('Umbra',XO+.35*d2,Y(0)+4);
  }else{
   lab('Penumbra',XO+t*d2,Y(hp)+16);
   lab('Umbra',XO+dt*.4,Y(0)+4);
   if(Math.abs(Ru)*.6>=8&&XW-XO-dt>70)lab('Antumbra',XO+dt+(XW-XO-dt)*.55,Y(0)+4);
  }
 }
 x.strokeStyle='#333';x.lineWidth=1;x.setLineDash([4,6]);x.beginPath();x.moveTo(0,CY);x.lineTo(XW,CY);x.stroke();x.setLineDash([]);
 const g=x.createRadialGradient(XL,CY,Rl*.2,XL,CY,Rl*2.2);g.addColorStop(0,'rgba(255,240,150,.9)');g.addColorStop(1,'rgba(255,170,0,0)');
 x.fillStyle=g;x.beginPath();x.arc(XL,CY,Rl*2.2,0,7);x.fill();x.fillStyle='#ffe066';x.beginPath();x.arc(XL,CY,Rl,0,7);x.fill();
 x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText('Light source',XL,CY+Math.max(Rl*2.2,60)+12);
 x.fillStyle='#d9d4c8';x.fillRect(XW,CY-WALLH,16,2*WALLH);
 const P=pts(Rl);let n=0;
 [...sel].sort().forEach(i=>{
  const p=P[i];let lo=1e9,hi=-1e9;
  x.lineWidth=1.3;x.strokeStyle=COL[i];x.globalAlpha=.9;
  for(let ty=CY-WALLH;ty<=CY+WALLH;ty+=16){
   const h=hit(p.x,p.y,ty,XO,Ro);
   x.beginPath();x.moveTo(p.x,p.y);
   if(h){x.lineTo(h.x,h.y);}else x.lineTo(XW,ty);
   x.stroke();
  }
  x.globalAlpha=1;
  for(let ty=CY-WALLH;ty<=CY+WALLH;ty+=1){if(hit(p.x,p.y,ty,XO,Ro)){lo=Math.min(lo,ty);hi=Math.max(hi,ty);}}
  const bx=XW+17+n*5;
  x.fillStyle=COL[i];x.fillRect(bx,CY-WALLH,3,2*WALLH);
  if(hi>=lo){x.fillStyle='#000';x.fillRect(bx,lo,3,hi-lo);}
  n++;
 });
 x.fillStyle='#4a6fa8';x.beginPath();x.arc(XO,CY,Ro,0,7);x.fill();x.strokeStyle='#9bd';x.lineWidth=1.5;x.stroke();
 x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText('Object',XO,CY+Ro+20);
 x.fillText('Wall',XW+8,CY-WALLH-6);
 P.forEach((p,i)=>{x.beginPath();x.arc(p.x,p.y,sel.has(i)?8:6,0,7);x.fillStyle=COL[i];x.fill();x.lineWidth=2;x.strokeStyle=sel.has(i)?'#fff':'#442';x.stroke();});
 x.restore();
 const WX=790,WY=CY,S=0.5,PR=Rp*S,UR=Math.abs(Ru)*S;
 x.fillStyle='#d9d4c8';x.fillRect(670,CY-240,260,480);
 x.save();x.beginPath();x.rect(670,CY-240,260,480);x.clip();
 if(PR>0){const inner=Math.min(UR/PR,.999);const gg=x.createRadialGradient(WX,WY,0,WX,WY,PR);
  if(Ru>=0){gg.addColorStop(0,'rgba(10,10,16,1)');gg.addColorStop(inner,'rgba(10,10,16,1)');gg.addColorStop(1,'rgba(10,10,16,0)');}
  else{gg.addColorStop(0,'rgba(10,10,16,.62)');gg.addColorStop(inner,'rgba(10,10,16,.62)');gg.addColorStop(Math.min(inner+0.001,1),'rgba(10,10,16,.62)');gg.addColorStop(1,'rgba(10,10,16,0)');}
  x.fillStyle=gg;x.beginPath();x.arc(WX,WY,PR,0,7);x.fill();}
 x.restore();
 x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText('The wall, seen from the front',WX,CY-WALLH-6);
 x.fillText('(half size)',WX,CY+WALLH+16);
 x.strokeStyle='#444';x.lineWidth=1;x.strokeRect(670,CY-240,260,480);
 $('stat').textContent=sel.size==0
  ?'Click the coloured dots on the light source to send beams from that point.'
  :'Each beam either reaches the wall or is stopped by the object. The black strip beside the wall shows where light from that dot cannot reach. Try different dots: the shadow moves.';
}
c.onclick=e=>{
 if(level!=1)return;
 const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;
 const P=pts(+$('rl').value);let best=-1,bd=16;
 P.forEach((p,i)=>{const d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;best=i;}});
 if(best>=0){sel.has(best)?sel.delete(best):sel.add(best);draw();}
};
$('clr').onclick=()=>{sel.clear();draw()};
$('all').onclick=()=>{K.forEach((k,i)=>sel.add(i));draw()};
/* ================= SHARED (Moon model) ================= */
const ER=24,MR=7,MO3=100,TILT=25*Math.PI/180;
let ang=+$('se').value,playing=false,spdI=0;const SPD=[['Normal',1],['Slow',.35],['Very slow',.12]];
function moonSide(th,b){const psi=th+b,u=MO3*Math.cos(psi),w=MO3*Math.sin(psi)*Math.cos(TILT),h=MO3*Math.sin(psi)*Math.sin(TILT);
 return{xs:u*Math.cos(b)+w*Math.sin(b),zs:-u*Math.sin(b)+w*Math.cos(b),h:h}}
/* ================= LEVEL 2 (solar eclipse) ================= */
const RS3=26,DS3=400,MS3=8;
function solarState(q){const xs=q.xs;if(xs<=0)return{st:0};
 const DSM=DS3-xs,P=Math.hypot(q.h,q.zs),cs=DS3/DSM,c=P*cs;
 const hpm=MS3+(MS3+RS3)*xs/DSM,hum=MS3-(RS3-MS3)*xs/DSM;
 let st=0;if(c<ER+hpm)st=1;if(hum>0&&c<ER+hum)st=2;
 return{st,c,cs,hpm,hum}}
function draw2(){
 const mang=((180+(ang-15)/29.1*360)%360+360)%360,m=mang*Math.PI/180,b=ang*Math.PI/180,q=moonSide(m,b),S=solarState(q);
 x.fillStyle='#000';x.fillRect(0,0,1280,560);
 const XE=470,YE=270,SX=XE-DS3;
 x.save();x.beginPath();x.rect(0,0,640,560);x.clip();
 const g=x.createRadialGradient(SX,YE,RS3*.3,SX,YE,RS3*2);g.addColorStop(0,'rgba(255,240,150,.9)');g.addColorStop(1,'rgba(255,170,0,0)');
 x.fillStyle=g;x.beginPath();x.arc(SX,YE,RS3*2,0,7);x.fill();x.fillStyle='#ffd84a';x.beginPath();x.arc(SX,YE,RS3,0,7);x.fill();
 x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText('Sun',SX,YE+RS3+22);
 const mx=XE-q.xs,my=YE+q.zs,vx=mx-SX,vy=my-YE,len=Math.hypot(vx,vy),ux=vx/len,uy=vy/len,nx=-uy,ny=ux;
 const Lum=MS3*len/(RS3-MS3),T=260,hpT=MS3+(MS3+RS3)*T/len;
 x.fillStyle='rgba(150,150,170,.30)';x.beginPath();x.moveTo(mx+nx*MS3,my+ny*MS3);x.lineTo(mx+ux*T+nx*hpT,my+uy*T+ny*hpT);x.lineTo(mx+ux*T-nx*hpT,my+uy*T-ny*hpT);x.lineTo(mx-nx*MS3,my-ny*MS3);x.closePath();x.fill();
 x.fillStyle='rgba(30,30,44,.95)';x.beginPath();x.moveTo(mx+nx*MS3,my+ny*MS3);x.lineTo(mx+ux*Lum,my+uy*Lum);x.lineTo(mx-nx*MS3,my-ny*MS3);x.closePath();x.fill();
 if(q.xs>0){x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';
  const tp=150,hp=MS3+(MS3+RS3)*tp/len;x.fillText('Penumbra',mx+ux*tp+nx*(hp+14),my+uy*tp+ny*(hp+14)+4);
  const tu=Math.min(Lum*.5,50);x.fillText('Umbra',mx+ux*tu-nx*(MS3+14),my+uy*tu-ny*(MS3+14)+4);}
 x.strokeStyle='rgba(170,170,190,.3)';x.lineWidth=1.5;x.beginPath();
 for(let k=0;k<=72;k++){const p=moonSide(k*Math.PI/36,b);const sx=XE-p.xs,sy=YE+p.zs;k?x.lineTo(sx,sy):x.moveTo(sx,sy)}x.stroke();
 x.fillStyle='#2a6fd6';x.beginPath();x.arc(XE,YE,ER,0,7);x.fill();x.fillStyle='#4aa84a';x.beginPath();x.arc(XE-7,YE-5,9,0,7);x.fill();
 x.fillStyle='rgba(0,0,20,.65)';x.beginPath();x.arc(XE,YE,ER,-Math.PI/2,Math.PI/2);x.fill();
 x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Earth',XE,YE+ER+18);
 x.fillStyle='#333';x.beginPath();x.arc(mx,my,MS3,0,7);x.fill();
 const toSun=Math.atan2(YE-my,SX-mx);x.fillStyle='#e8e8ee';x.beginPath();x.arc(mx,my,MS3,toSun-Math.PI/2,toSun+Math.PI/2);x.fill();
 x.strokeStyle='#999';x.lineWidth=1;x.beginPath();x.arc(mx,my,MS3,0,7);x.stroke();
 x.fillStyle='#fff';x.font='bold 13px Arial';x.fillText('Moon',mx,my+(q.zs<0?-MS3-6:MS3+16));
 x.restore();
 x.fillStyle='#ffd84a';x.font='bold 15px Arial';x.textAlign='left';x.fillText('TOP VIEW',12,24);
 x.strokeStyle='#555';x.lineWidth=2;x.beginPath();x.moveTo(640,0);x.lineTo(640,560);x.stroke();
 // ---- right: view from the Sun ----
 x.save();x.translate(640,0);
 const VX=320,VY=270,s=2.4,front=q.xs>0,mx2=VX+q.zs*s,my2=VY-q.h*s;
 const earth=()=>{x.fillStyle='#2a6fd6';x.beginPath();x.arc(VX,VY,ER*s,0,7);x.fill();x.fillStyle='#4aa84a';x.beginPath();x.arc(VX-14,VY-10,22,0,7);x.fill();x.beginPath();x.arc(VX+20,VY+18,15,0,7);x.fill();};
 earth();
 if(front){x.save();x.beginPath();x.arc(VX,VY,ER*s,0,7);x.clip();
  const cx=VX+q.zs*S.cs*s,cy=VY-q.h*S.cs*s;
  x.fillStyle='rgba(10,10,30,.45)';x.beginPath();x.arc(cx,cy,S.hpm*s,0,7);x.fill();
  if(S.hum>0){x.fillStyle='rgba(0,0,0,.92)';x.beginPath();x.arc(cx,cy,S.hum*s,0,7);x.fill();}
  x.restore();}
 x.strokeStyle='#9bd';x.lineWidth=1.5;x.beginPath();x.arc(VX,VY,ER*s,0,7);x.stroke();
 if(front){x.fillStyle='rgba(232,232,238,.22)';x.beginPath();x.arc(mx2,my2,MS3*s,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
  x.fillStyle='#bbb';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Moon',mx2,my2-MS3*s-8);}
 x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Earth',VX,VY+ER*s+18);
 x.fillStyle='#ffd84a';x.font='bold 15px Arial';x.textAlign='left';x.fillText('VIEW FROM THE SUN',12,24);
 x.restore();
 const nm=Math.abs(((mang+180)%360)-180)<7;
 const msg=['The Moon\'s shadow misses Earth: no solar eclipse.','Earth is inside the Moon\'s penumbra: a partial solar eclipse for people in that spot.','The Moon\'s umbra touches Earth: a total solar eclipse for people in the umbra spot!'][S.st];
 $('stat').textContent=(nm?'NEW MOON. ':'')+(q.xs>0?msg:'The Moon is on the far side of Earth, so it cannot block the Sun.');
}
function draw(){level==1?draw1():draw2()}
function setLevel(l){level=l;
 c.width=l==1?940:1280;c.height=l==1?520:560;
 $('main').style.maxWidth=l==1?'940px':'none';
 document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('on',+b.dataset.l==l));
 document.querySelectorAll('.l1').forEach(e=>e.style.display=l==1?'flex':'none');
 document.querySelectorAll('.l2').forEach(e=>e.style.display=l==2?'flex':'none');
 $('msg').textContent=TXT[l];location.hash=l;draw()}
document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>setLevel(+b.dataset.l));
['rl','ro','xo','fill'].forEach(id=>$(id).oninput=draw);
$('se').oninput=()=>{ang=+$('se').value;draw()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};
$('spd').onclick=()=>{spdI=(spdI+1)%3;$('spd').textContent='Speed: '+SPD[spdI][0]};
let last=0;function tick(t){if(playing&&level==2){const d=(t-last)*SPD[spdI][1];ang=(ang+d*0.025)%360;$('se').value=ang;draw()}last=t;requestAnimationFrame(tick)}
setLevel(location.hash=='#2'||location.hash=='#3'?2:1);requestAnimationFrame(tick);
</script></body></html>
