<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipses level 1: Earth's shadow cone</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center}
h1{font-size:20px;margin:10px 0 4px}
canvas{background:#000;border-radius:8px;max-width:96vw;height:auto}
.ctl{width:min(92vw,820px);display:flex;align-items:center;gap:12px;margin:6px 0;flex-wrap:wrap}
input[type=range]{flex:1;min-width:200px;height:28px}
button{background:#f28c1a;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:bold;font-size:15px;cursor:pointer}
label{font-size:15px}
.sub{font-size:13px;color:#bbb}
</style></head><body>
<h1>Earth's shadow cone</h1>
<canvas id="c" width="640" height="560"></canvas>
<div class="ctl"><button id="play">Play</button>
<input id="s" type="range" min="0" max="360" step="0.5" value="200" aria-label="Earth position in its orbit">
<label><input type="checkbox" id="cone" checked> Show shadow cone</label></div>
<div class="ctl sub">Drag the slider, or press Play, to move Earth around the Sun. The Sun lights one half of Earth. The shadow cone is the dark space behind Earth, always pointing away from the Sun. (Sizes and distances are not to scale.)</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const s=document.getElementById('s'),pb=document.getElementById('play'),cb=document.getElementById('cone');
const CX=320,CY=280,R=135,ER=24,L=105;let ang=+s.value,playing=false;
function draw(){
 x.fillStyle='#000';x.fillRect(0,0,640,560);
 // Sun glow + sun
 const g=x.createRadialGradient(CX,CY,10,CX,CY,70);g.addColorStop(0,'#fff6a0');g.addColorStop(.5,'#ffc83a');g.addColorStop(1,'rgba(255,160,0,0)');
 x.fillStyle=g;x.beginPath();x.arc(CX,CY,70,0,7);x.fill();
 x.fillStyle='#ffd84a';x.beginPath();x.arc(CX,CY,38,0,7);x.fill();
 x.fillStyle='#fff';x.font='bold 16px Arial';x.textAlign='center';x.fillText('Sun',CX,CY+62);
 // orbit
 x.strokeStyle='#888';x.lineWidth=1.5;x.setLineDash([6,6]);x.beginPath();x.arc(CX,CY,R,0,7);x.stroke();x.setLineDash([]);
 // Earth position (counter-clockwise seen from above)
 const a=ang*Math.PI/180,ex=CX+R*Math.cos(a),ey=CY-R*Math.sin(a);
 const dx=(ex-CX)/R,dy=(ey-CY)/R;      // unit vector pointing away from Sun
 const px=-dy,py=dx;                   // perpendicular
 // shadow cone: from Earth's edges tapering to a point L behind it
 if(cb.checked){
  const tx=ex+dx*(ER+L),ty=ey+dy*(ER+L);
  const gr=x.createLinearGradient(ex,ey,tx,ty);gr.addColorStop(0,'rgba(120,120,140,.75)');gr.addColorStop(1,'rgba(120,120,140,.18)');
  x.fillStyle=gr;x.beginPath();x.moveTo(ex+px*ER,ey+py*ER);x.lineTo(tx,ty);x.lineTo(ex-px*ER,ey-py*ER);x.closePath();x.fill();
  x.strokeStyle='#cfd2e6';x.lineWidth=1.5;x.setLineDash([5,4]);x.stroke();x.setLineDash([]);
  const lx=ex+dx*(ER+L*.5),ly=ey+dy*(ER+L*.55);
  x.save();x.translate(lx,ly);let r=Math.atan2(dy,dx);if(Math.cos(r)<0)r+=Math.PI;x.rotate(r);
  x.fillStyle='#fff';x.font='bold 13px Arial';x.textAlign='center';x.fillText('Shadow cone',0,5);x.restore();
 }
 // Earth: half facing Sun lit, other half dark
 x.fillStyle='#2a6fd6';x.beginPath();x.arc(ex,ey,ER,0,7);x.fill();
 x.fillStyle='#4aa84a';x.beginPath();x.arc(ex-6,ey-5,10,0,7);x.fill();x.beginPath();x.arc(ex+9,ey+8,7,0,7);x.fill();
 x.fillStyle='rgba(0,0,20,.65)';x.beginPath();x.arc(ex,ey,ER,Math.atan2(dy,dx)-Math.PI/2,Math.atan2(dy,dx)+Math.PI/2);x.fill();
 x.strokeStyle='#9bd';x.lineWidth=1;x.beginPath();x.arc(ex,ey,ER,0,7);x.stroke();
 x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText('Earth',ex,ey+(dy<0?ER+18:-ER-10));
}
s.oninput=()=>{ang=+s.value;draw()};cb.onchange=draw;
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play'};
let last=0;function tick(t){if(playing){ang=(ang+(t-last)*0.02)%360;s.value=ang;draw()}last=t;requestAnimationFrame(tick)}
draw();requestAnimationFrame(tick);
</script></body></html>
